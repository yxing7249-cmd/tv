name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract Android project
        run: |
          unzip -t NEXUS_TV_DESKTOP_V6_SOURCE.zip
          unzip -q NEXUS_TV_DESKTOP_V6_SOURCE.zip -d /tmp/nexus-tv-source
          cp -a /tmp/nexus-tv-source/app ./app
          cp /tmp/nexus-tv-source/build.gradle.kts .
          cp /tmp/nexus-tv-source/gradle.properties .
          cp /tmp/nexus-tv-source/settings.gradle.kts .

      - name: Align Java and Kotlin JVM targets
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-tv-desktop-v6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
